<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page - Issue #2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        h2 { text-align: center; margin-bottom: 20px; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
        }
        input:focus { border-color: #667eea; }
        .btn {
            width: 100%;
            padding: 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        .btn:hover { background: #5a6fd6; }
        .links { text-align: center; margin-top: 15px; font-size: 14px; }
        .links a { color: #667eea; text-decoration: none; }
        .error { color: red; font-size: 12px; margin-top: 4px; display: none; }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>
                <p class="error" id="emailError">Enter valid email</p>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
                <p class="error" id="passError">Password must be 6+ characters</p>
            </div>
            <button type="submit" class="btn">Login</button>
            <div class="links">
                <p>Don't have an account? <a href="register.html">Register</a></p>
            </div>
        </form>
    </div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(e){
        e.preventDefault();
        let email = document.getElementById('email').value;
        let pass = document.getElementById('password').value;
        let valid = true;

        if(!email.includes('@')){
            document.getElementById('emailError').style.display = 'block';
            valid = false;
        } else {
            document.getElementById('emailError').style.display = 'none';
        }

        if(pass.length < 6){
            document.getElementById('passError').style.display = 'block';
            valid = false;
        } else {
            document.getElementById('passError').style.display = 'none';
        }

        if(valid){
            alert('Login Successful! (Issue #2 Completed)');
        }
    });
</script>
</body>
</html>
