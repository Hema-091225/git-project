<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Issue #3</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #f4f6f9; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { text-align: center; margin: 20px 0; color: #333; }
        .contact-wrapper {
            display: flex; gap: 20px; background: white;
            padding: 25px; border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            flex-wrap: wrap;
        }
        .contact-info, .contact-form { flex: 1; min-width: 300px; }
        .contact-info { background: #667eea; color: white; padding: 20px; border-radius: 8px; }
        .contact-info h3 { margin-bottom: 15px; }
        .info-item { margin: 12px 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input, textarea {
            width: 100%; padding: 10px; border: 1px solid #ccc;
            border-radius: 6px; outline: none;
        }
        textarea { resize: none; height: 100px; }
        input:focus, textarea:focus { border-color: #667eea; }
        .btn {
            width: 100%; padding: 10px; background: #667eea;
            color: white; border: none; border-radius: 6px;
            cursor: pointer; font-size: 16px;
        }
        .btn:hover { background: #5a6fd6; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Contact Us</h1>
        <div class="contact-wrapper">
            <div class="contact-info">
                <h3>Contact Information</h3>
                <div class="info-item">📧 Email: support@fsdproject.com</div>
                <div class="info-item">📞 Phone: +91 98765 43210</div>
                <div class="info-item">📍 Address: Hyderabad, Telangana</div>
                <div class="info-item">🕒 Hours: Mon - Fri, 9AM - 6PM</div>
                <br>
                <p>We would love to hear from you! Fill the form and we will reply soon.</p>
            </div>
            <div class="contact-form">
                <form id="contactForm">
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" id="name" placeholder="Your Name" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" placeholder="Your Email" required>
                    </div>
                    <div class="form-group">
                        <label>Subject</label>
                        <input type="text" id="subject" placeholder="Subject" required>
                    </div>
                    <div class="form-group">
                        <label>Message</label>
                        <textarea id="message" placeholder="Your Message..." required></textarea>
                    </div>
                    <button type="submit" class="btn">Send Message</button>
                </form>
            </div>
        </div>
    </div>

<script>
    document.getElementById('contactForm').addEventListener('submit', function(e){
        e.preventDefault();
        alert('Message Sent Successfully! (Issue #3 Completed)');
        this.reset();
    });
</script>
</body>
</html>
